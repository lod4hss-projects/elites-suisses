<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SPARQL + D3 Bar Chart</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://rdf.js.org/comunica-browser/versions/v4/engines/query-sparql/comunica-browser.js"></script>
  <link rel="stylesheet" href="../base_style.css"></link>

<style>
    .bar {
      fill: steelblue;
    }
    .bar:hover {
      fill: orange;
    }
    .axis text {
      font: 10px sans-serif;
    }
    .axis path,
    .axis line {
      fill: none;
      stroke: #000;
      shape-rendering: crispEdges;
    }
    .label {
      font: 12px sans-serif;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <h3>Generations Count (from SPARQL on local Turtle file)</h3>

  <p><i style="font-size: 60%;">Beware: it can take from 20 seconds to one minute to load even if only 346135 triples in the graph.s</i></p>
  <div id="chart"></div>

  <script>

    // Your SPARQL query
    const query = `
      prefix owl: <http://www.w3.org/2002/07/owl#>
      prefix esr: <http://elites_suisses/resource/>
      prefix eso: <http://elites_suisses/ontology/>
      prefix xsd: <http://www.w3.org/2001/XMLSchema#>
      prefix crm: <http://www.cidoc-crm.org/cidoc-crm/>
      prefix swel: <https://swiss-elites.lod4hss.cloud/resource/>
      prefix sdh-short: <https://sdhss.org/ontology/shortcuts/>

      select ?generation (count(*) as ?number)
      where {
          ?s a crm:E21;
          sdh-short:P2 ?birth.
          FILTER (?birth != 0)   
          BIND ( 
              IF (?birth < 1801, '1800_et_ante', 
                  IF (?birth < 1826, '1801-1925',
                      IF (?birth < 1851, '1826-1850',
                          IF (?birth < 1876, '1851-1875', 
                              IF (?birth < 1901, '1876-1900', 
                              IF (?birth < 1926, '1901-1925', 
                              IF (?birth < 1951, '1926-1950', 
                              IF (?birth < 1976, '1951-1975', 
                              IF (?birth > 1975, '1976-...', 'none'))))))))
                      ) AS ?generation
              )
      } 
      group by ?generation
      order by ?generation
    `;

    // Replace with your actual TTL file URL
    const ttlUrl = 'https://elites-suisses.lod4hss.org/data/statements_20260130_wisski.ttl'; // your Turtle file URL

    const generation = [];
    const number = [];

    // Run query
    // https://comunica.dev/docs/query/getting_started/query_browser_app/
    new Comunica.QueryEngine().queryBindings(query, {
      sources: [ttlUrl]    })
    .then (result => {
        result.on('data', binding => {
            
          generation.push(binding.get('generation').value);
          number.push(parseInt(binding.get('number').value));
        });

         result.on('end', () => {
        // ✅ Now all data is collected — render chart
        console.log("Generations:", generation);
        console.log("Counts:", number);

        

        const labels = generation;
        const counts = number;

        const margin = { top: 20, right: 20, bottom: 150, left: 40 };
        const width = Math.min(600, window.innerWidth - 40) - margin.left - margin.right;
        const height = Math.min(450, window.innerHeight - 100) - margin.top - margin.bottom;



    // Create the SVG container
    const svg = d3.select('#chart')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left}, ${margin.top})`);

    // Create scales for x and y axes
    const x = d3.scaleBand()
    .domain(labels)
    .range([0, width])
    .padding(0.3);

    const maxCount = d3.max(counts) || 0; // fallback if all NaN or empty
    const y = d3.scaleLinear()
    .domain([0, maxCount])
    .range([height, 0]);

    // Add x and y axes
    svg.append('g')
    .attr('transform', `translate(0, ${height})`)
    .call(d3.axisBottom(x)) .selectAll("text")
    .style("text-anchor", "end")
    .attr("dx", "-.8em")
    .attr("dy", ".15em")
    .attr("transform", "rotate(-30)");

    svg.append('g')
    .call(d3.axisLeft(y));


    // Add chart title at the bottom
    svg.append("text")
    .attr("class", "chart-title")
    .attr("x", width / 2)  // center horizontally
    .attr("y", height + margin.bottom - 80)  // just below the x-axis
    .attr("text-anchor", "middle")
    .text("Number of Persons by Generation")
    .style("font-size", "12px")
    .style("font-weight", "bold")
    .style("fill", "#333")
    .style("font-family", "sans-serif");




    // Add value labels ON TOP of bars
    svg.selectAll(".bar-label")
    .data(counts)
    .enter().append("text")
        .attr("class", "bar-label")
        .attr("x", (d, i) => x(labels[i]) + x.bandwidth() / 2)  // center horizontally
        .attr("y", (d) => y(d) - 8)  // 8px above the top of the bar
        .attr("text-anchor", "middle")
        .text(d => d)  // or d.toLocaleString() for commas
        .style("font-size", "12px")
        //.style("font-weight", "bold")
        .style("fill", "black")
        .style("text-shadow", "1px 1px 2px rgba(255,255,255,0.8)")  // improves readability
        .style("pointer-events", "none");  // don't interfere with hover


    // Create bars
    svg.selectAll('.bar')
    .data(counts)
    .enter().append('rect')
    .attr('class', 'bar')
    .attr('x', (d, i) => x(labels[i]))
    .attr('y', d => y(d))
    .attr('width', x.bandwidth())
    .attr('height', d => height - y(d))
    .attr("fill", "#add8e6");

    });
})
    .catch(err => {
      console.error("Error running SPARQL query:", err);
      document.getElementById("chart").innerText = "Error loading data: " + err.message;
    });


  </script>
</body>
</html>
