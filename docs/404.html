<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swiss Elites</title>
  <script>
    /* Linked Data dereferencing for URIs in https://elites-suisses.lod4hss.org/resource/…
       persons (p…)       → person.html?id=…
       organisations (g…) → organisation.html?id=…
       anything else      → generic instance page (legacy) */
    (function () {
      var m = location.pathname.match(/^(.*?)\/resource\/([^\/?#]+)\/?$/);
      if (!m) return;
      var base = m[1] + '/', id = decodeURIComponent(m[2]), target;
      if (/^p\d+$/.test(id)) target = base + 'person.html?id=' + id;
      else if (/^g\d+$/.test(id)) target = base + 'organisation.html?id=' + id;
      else target = base + 'sparql-queries/instance-page.html?uri=' +
        encodeURIComponent('https://elites-suisses.lod4hss.org/resource/' + id);
      location.replace(target);
    })();
  </script>
  <base href="/">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/core.js"></script>
</head>
<body>
<main id="main">
  <section class="page-hero">
    <div class="container" style="padding-bottom:80px">
      <p class="eyebrow">404</p>
      <h1>Page not found · Page introuvable · Seite nicht gefunden</h1>
      <p><a class="btn btn-primary" href="index.html" data-nav data-i18n="nav.home" style="margin-top:1rem"></a></p>
    </div>
  </section>
</main>
<script>ES.init();</script>
</body>
</html>
