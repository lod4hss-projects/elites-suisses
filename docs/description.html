<script>
const EX_Q = `
# Members of the Federal Council (es:g80), with start and end of mandate
SELECT ?person ?name ?start ?end WHERE {
  ?membership sdh-slc:P2 es:g80 ;
              sdh-slc:P1 ?person ;
              sdh-short:P4 ?start .
  OPTIONAL { ?membership sdh-short:P7 ?end }
  ?person sdh-short:P9 ?name .
}
ORDER BY DESC(?start)
LIMIT 12`;

ES.init(() => {
  const ep = document.getElementById('epLink'); ep.href = ES.ENDPOINT; ep.textContent = ES.ENDPOINT;
  document.getElementById('graphName').textContent = ES.GRAPH;
  document.getElementById('nsName').textContent = ES.NS;
  const box = document.getElementById('exampleTable');
  let rows = null;
  const render = () => {
    ES.queryBox(document.getElementById('exampleQuery'), EX_Q);
    if (!rows) return;
    box.innerHTML = `<div class="table-wrap"><table class="data"><thead><tr>
      <th>${ES.t('col.name')}</th><th>${ES.t('col.from')}</th><th>${ES.t('col.to')}</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${ES.personLink(r.person, r.name)}</td><td class="num">${ES.esc(r.start)}</td><td class="num">${ES.esc(r.end || '')}</td></tr>`).join('')}
      </tbody></table></div>`;
  };
  ES.loading(box);
  render();
  document.addEventListener('es:lang', render);
  ES.sparql(EX_Q).then(r => { rows = r; render(); }).catch(e => ES.fail(box, e));
});
</script>
