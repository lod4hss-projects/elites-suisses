<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persons · Linked Elites Suisses</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/core.js"></script>
</head>
<body data-section="persons.html" data-title-key="nav.persons">
<main id="main">
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow" data-i18n="persons.eyebrow"></p>
      <h1 data-i18n="persons.title"></h1>
      <p data-i18n="persons.lead"></p>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <form class="toolbar" id="filters" role="search">
        <input class="grow" type="search" id="q" data-i18n-attr="placeholder:persons.searchPh;aria-label:persons.searchPh">
        <select id="g" data-i18n-attr="aria-label:persons.gender">
          <option value="" data-i18n="persons.gender"></option>
          <option value="gen1" data-i18n="common.women"></option>
          <option value="gen2" data-i18n="common.men"></option>
          <option value="unknown" data-i18n="common.unknown"></option>
        </select>
        <input type="number" id="from" min="1500" max="2010" style="width:9.5em" data-i18n-attr="placeholder:persons.from;aria-label:persons.from">
        <input type="number" id="to" min="1500" max="2010" style="width:7em" data-i18n-attr="placeholder:persons.to;aria-label:persons.to">
        <select id="sort" data-i18n-attr="aria-label:persons.sort">
          <option value="name" data-i18n="persons.sortName"></option>
          <option value="birth" data-i18n="persons.sortBirth"></option>
          <option value="mand" data-i18n="persons.sortMand"></option>
        </select>
      </form>
      <div class="chips" id="chips" aria-live="polite"></div>
      <div id="results"></div>
      <div class="pager" id="pager"></div>
      <div id="query"></div>
    </div>
  </section>
</main>
<script>
const PAGE = 25;
const st = { q: '', g: '', from: '', to: '', sort: 'name', page: 1 };
/* Filters that come from links (charts, key figures) – shown as removable chips. */
const EXTRA = {
  active: /^\d{4}$/, type: /^[1-7]$/, org: /^g\d+$/, born: /^gp\d+$/, disc: /^stu-dis\d+$/,
  deg: /^stu-tit\d+$/, inst: /^g\d+$/, edu: /^1$/, wd: /^1$/,
};
const FORM = ['q', 'g', 'from', 'to', 'sort'];
Object.keys(EXTRA).forEach(k => st[k] = '');

function whereClause() {
  const w = [`?person a crm:E21 ; sdh-short:P9 ?name .`];
  if (st.q) w.push(`FILTER(CONTAINS(LCASE(STR(?name)), LCASE("${ES.lit(st.q)}")))`);
  if (st.g === 'unknown') w.push(`FILTER NOT EXISTS { ?person sdh-slc:P23 ?anyGender }`);
  else if (/^gen\d$/.test(st.g)) w.push(`?person sdh-slc:P23 es:${st.g} .`);
  const yf = /^\d{3,4}$/.test(st.from), yt = /^\d{3,4}$/.test(st.to);
  if (yf || yt) {
    w.push(`?person sdh-short:P2 ?birthF .`);
    if (yf) w.push(`FILTER(?birthF >= ${+st.from})`);
    if (yt) w.push(`FILTER(?birthF <= ${+st.to})`);
  }
  if (st.active || st.type || st.org) {
    const c = [`?am sdh-slc:P1 ?person`];
    if (st.org) c.push(`sdh-slc:P2 es:${st.org}`);
    else if (st.type) c.push(`sdh-slc:P2 ?amBody`);
    if (st.active) c.push(`sdh-short:P4 ?amStart`, `sdh-short:P7 ?amEnd`);
    let inner = c.join(' ; ') + ' .';
    if (st.type && !st.org) inner += ` ?amBody sdh:P99 es:g-ty${st.type} .`;
    if (st.active) inner += ` FILTER(?amStart <= ${+st.active} && ?amEnd >= ${+st.active})`;
    w.push(`FILTER EXISTS { ${inner} }`);
  }
  if (st.born) w.push(`FILTER EXISTS { ?bEv crm:P98 ?person ; sdh:P6 es:${st.born} }`);
  if (st.disc || st.deg || st.inst || st.edu) {
    const c = [`?edu sdh-sls:P9 ?person`];
    if (st.disc) c.push(`sdh-sls:P25 es:${st.disc}`);
    if (st.deg) c.push(`sdh-sls:P10 es:${st.deg}`);
    if (st.inst) c.push(`sdh-sls:P17 es:${st.inst}`);
    w.push(`FILTER EXISTS { ${c.join(' ; ')} }`);
  }
  if (st.wd) w.push(`FILTER EXISTS { ?person owl:sameAs ?anyWd }`);
  return w.map(l => '  ' + l).join('\n');
}

/* ---- filter chips ---- */
const labelCache = {};
async function labelOf(id) {
  if (!labelCache[id]) labelCache[id] = ES.sparql(`SELECT ?l WHERE { es:${id} sdh-short:P9 ?l } LIMIT 1`).then(r => r[0]?.l || id).catch(() => id);
  return labelCache[id];
}
async function renderChips() {
  const el = document.getElementById('chips');
  const items = [];
  if (st.active) items.push(['active', ES.t('persons.f.active', { y: st.active })]);
  if (st.type) items.push(['type', ES.t('type.' + st.type)]);
  if (st.org) items.push(['org', ES.t('persons.f.org', { o: await labelOf(st.org) })]);
  if (st.born) items.push(['born', ES.t('persons.f.born', { p: await labelOf(st.born) })]);
  if (st.disc) items.push(['disc', ES.t('persons.f.disc', { d: await labelOf(st.disc) })]);
  if (st.deg) items.push(['deg', ES.t('persons.f.deg', { d: await labelOf(st.deg) })]);
  if (st.inst) items.push(['inst', ES.t('persons.f.inst', { i: await labelOf(st.inst) })]);
  if (st.edu) items.push(['edu', ES.t('persons.f.edu')]);
  if (st.wd) items.push(['wd', ES.t('persons.f.wd')]);
  el.innerHTML = items.map(([k, label]) =>
    `<button type="button" class="chip" data-k="${k}" title="${ES.t('persons.f.remove')}">${ES.esc(label)} <span aria-hidden="true">×</span></button>`).join('');
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => { st[b.dataset.k] = ''; st.page = 1; run(); });
}
function listQuery() {
  const order = { name: 'ASC(LCASE(STR(?name)))', birth: 'ASC(?birth) ASC(?name)', mand: 'DESC(?mandates) ASC(?name)' }[st.sort];
  return `
SELECT ?person ?name ?birth ?death ?gender (COUNT(DISTINCT ?m) AS ?mandates) (SAMPLE(?wd) AS ?wikidata) WHERE {
${whereClause()}
  OPTIONAL { ?person sdh-short:P2 ?birth }
  OPTIONAL { ?person sdh-short:P13 ?death }
  OPTIONAL { ?person sdh-slc:P23 ?gender }
  OPTIONAL { ?m sdh-slc:P1 ?person }
  OPTIONAL { ?person owl:sameAs ?wd }
}
GROUP BY ?person ?name ?birth ?death ?gender
ORDER BY ${order}
LIMIT ${PAGE} OFFSET ${(st.page - 1) * PAGE}`;
}
const countQuery = () => `
SELECT (COUNT(?person) AS ?total) WHERE {
${whereClause()}
}`;

let rows = null, total = null, reqId = 0;

function render() {
  const el = document.getElementById('results'), pg = document.getElementById('pager');
  ES.queryBox(document.getElementById('query'), listQuery());
  if (!rows) return;
  if (!rows.length) { el.innerHTML = `<div class="status">${ES.t('common.noresults')}</div>`; pg.innerHTML = ''; return; }
  el.innerHTML = `<div class="table-wrap"><table class="data"><thead><tr>
    <th>${ES.t('col.name')}</th><th>${ES.t('col.life')}</th><th>${ES.t('col.gender')}</th>
    <th style="text-align:right">${ES.t('col.mandates')}</th><th>${ES.t('col.links')}</th></tr></thead><tbody>
    ${rows.map(r => {
      const unil = ES.unilUrl(r.person);
      return `<tr><td>${ES.personLink(r.person, r.name)}</td><td>${ES.life(r.birth, r.death)}</td><td>${ES.genderPill(r.gender)}</td>
        <td class="num">${ES.fmt(r.mandates)}</td>
        <td>${r.wikidata ? `<a class="pill wd" href="${ES.esc(r.wikidata)}" target="_blank" rel="noopener">Wikidata</a> ` : ''}${unil ? `<a class="pill" href="${unil}" target="_blank" rel="noopener">UNIL</a>` : ''}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  const pages = total ? Math.max(1, Math.ceil(total / PAGE)) : null;
  pg.innerHTML = `<span>${total !== null ? ES.t('common.results', { n: ES.fmt(total) }) + ' · ' : ''}${pages ? ES.t('common.page', { p: st.page, n: ES.fmt(pages) }) : ''}</span>
    <span class="btn-row"><button class="btn btn-sm" id="prev" ${st.page <= 1 ? 'disabled' : ''}>${ES.t('common.prev')}</button>
    <button class="btn btn-sm" id="next" ${(pages && st.page >= pages) || rows.length < PAGE ? 'disabled' : ''}>${ES.t('common.next')}</button></span>`;
  pg.querySelector('#prev').onclick = () => { st.page--; run(false); scrollTo({ top: 0, behavior: 'smooth' }); };
  pg.querySelector('#next').onclick = () => { st.page++; run(false); scrollTo({ top: 0, behavior: 'smooth' }); };
}

function syncUrl() {
  const u = new URL(location.href);
  [...FORM, ...Object.keys(EXTRA), 'page'].forEach(k => {
    const v = st[k];
    if (v && !(k === 'sort' && v === 'name') && !(k === 'page' && v === 1)) u.searchParams.set(k, v); else u.searchParams.delete(k);
  });
  history.replaceState(null, '', u);
}

async function run(recount = true) {
  const id = ++reqId, el = document.getElementById('results');
  syncUrl();
  renderChips();
  ES.loading(el);
  if (recount) total = null;
  try {
    const [r, c] = await Promise.all([ES.sparql(listQuery()), recount ? ES.sparql(countQuery()) : Promise.resolve(null)]);
    if (id !== reqId) return;
    rows = r; if (c) total = +c[0].total;
    render();
  } catch (e) { if (id === reqId) ES.fail(el, e); }
}

ES.init(() => {
  const p = new URLSearchParams(location.search);
  FORM.forEach(k => { if (p.get(k)) { st[k] = p.get(k); document.getElementById(k).value = st[k]; } });
  Object.entries(EXTRA).forEach(([k, re]) => { const v = p.get(k); if (v && re.test(v)) st[k] = v; });
  st.page = Math.max(1, parseInt(p.get('page') || '1', 10) || 1);
  const upd = ES.debounce(() => {
    FORM.forEach(k => st[k] = document.getElementById(k).value.trim());
    st.page = 1; run();
  }, 350);
  document.getElementById('filters').addEventListener('input', upd);
  document.getElementById('filters').addEventListener('submit', e => { e.preventDefault(); upd(); });
  document.addEventListener('es:lang', () => { render(); renderChips(); });
  run();
});
</script>
</body>
</html>
