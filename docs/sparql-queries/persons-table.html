<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persons</title>
  <style>
        body {
            background-color: rgb(226, 231, 235);
            font-family: Helvetica, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        h1 {
            color: rgb(22, 60, 109);
            font-family: Arial, Helvetica, sans-serif;
        }
        h2 {
            color: rgb(34, 108, 205);
            font-family: Arial, Helvetica, sans-serif;
        }

    .entity-header {
      margin-bottom: 20px;
    }

    .entity-header h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    .entity-header small {
      font-size: 0.9rem;
      color: rgb(113, 144, 144);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      display: block;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
      word-break: break-word;
      font-size: 0.9rem;
    }

    th {
      background-color: #f2f2f2;
      position: sticky;
      top: 0;
    }

    .pagination {
      margin: 20px 0;
      text-align: center;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pagination button {
      padding: 6px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f9f9f9;
      border-radius: 4px;
    }

    .pagination button:hover {
      background: #e9e9e9;
    }

    @media (max-width: 600px) {
      body {
        margin: 10px;
        font-size: 0.9rem;
      }

      .entity-header h1 {
        font-size: 1.2rem;
      }

      th, td {
        padding: 6px;
        font-size: 0.85rem;
      }

      .pagination button {
        padding: 4px 8px;
        font-size: 0.8rem;
      }
    }

    </style>
</head>
<body>
  <div>
    <h1>Swiss Elites — Persons</h1>
    <input type="text" id="searchInput" value="Moritz">
    <div id="tableContainer">Loading data...</div>
    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    const SPARQL_ENDPOINT = 'https://open-gdb.lod4hss.org/rdf4j-server/repositories/elites_suisses';
    const ITEMS_PER_PAGE = 10;
    let allData = [];
    let currentPage = 1;
    let filteredData = [];
    let currentSearchTerm = 'Moritz';

    const searchInput = document.getElementById('searchInput');
    const tableContainer = document.getElementById('tableContainer');
    const paginationContainer = document.getElementById('pagination');

    async function fetchData(searchTerm = '') {
      const filterClause = searchTerm ? `FILTER(CONTAINS(LCASE(?name), LCASE("${searchTerm}")))` : '';
      const query = `
        prefix owl: <http://www.w3.org/2002/07/owl#>
        prefix esr: <http://elites_suisses/resource/>
        prefix eso: <http://elites_suisses/ontology/>
        prefix xsd: <http://www.w3.org/2001/XMLSchema#>

        select ?s ?name ?birthYear ?url
        where {
            ?s a eso:Person;
               eso:nameForename ?name;
               eso:birthYear ?birthYear.
            ${filterClause}
            BIND(
                URI(REPLACE(str(?s), 'http://elites_suisses/resource/','https://elitessuisses.unil.ch/p/'))
                AS ?url
            )
        }
        ORDER BY ?name
        LIMIT 100
      `;

      try {
        const response = await fetch(SPARQL_ENDPOINT + '?query=' + encodeURIComponent(query), {
          headers: { 'Accept': 'application/sparql-results+json' }
        });
        const data = await response.json();
        allData = data.results.bindings.map(row => ({
          uri: row.s?.value || '#',
          name: row.name?.value || 'N/A',
          birthYear: row.birthYear?.value || 'N/A',
          url: row.url?.value || '#'
        }));
        filteredData = [...allData];
        renderTable();
        renderPagination();
      } catch (error) {
        tableContainer.innerHTML = `<div>No results or error: ${error.message}</div>`;
      }
    }

    function renderTable() {
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const pageData = filteredData.slice(startIndex, endIndex);

      if (pageData.length === 0) {
        tableContainer.innerHTML = '<div>No results found.</div>';
        return;
      }

      let tableHTML = `<br/>
      <table><thead><tr><th>Forename</th><th>Birth Year</th><th>Profile</th></tr></thead><tbody>`;
      pageData.forEach(row => {
        tableHTML += `<tr><td><a href="./person-page.html?uri=${escapeHtml(row.uri)}" target="_blank">${escapeHtml(row.name)}</a></td><td>${escapeHtml(row.birthYear)}</td><td><a href="${escapeHtml(row.url)}" target="_blank">View</a></td></tr>`;
      });
      tableHTML += `</tbody></table>`;
      tableContainer.innerHTML = tableHTML;
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
      paginationContainer.innerHTML = '';

      if (totalPages <= 1) return;

      const prevButton = document.createElement('button');
      prevButton.textContent = '← Previous';
      prevButton.disabled = currentPage === 1;
      prevButton.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
          renderPagination();
        }
      });
      paginationContainer.appendChild(prevButton);

      for (let i = 1; i <= totalPages; i++) {
        const pageButton = document.createElement('button');
        pageButton.textContent = i;
        if (i === currentPage) pageButton.classList.add('active');
        pageButton.addEventListener('click', () => {
          currentPage = i;
          renderTable();
          renderPagination();
        });
        paginationContainer.appendChild(pageButton);
      }

      const nextButton = document.createElement('button');
      nextButton.textContent = 'Next →';
      nextButton.disabled = currentPage === totalPages;
      nextButton.addEventListener('click', () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderTable();
          renderPagination();
        }
      });
      paginationContainer.appendChild(nextButton);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    searchInput.addEventListener('input', () => {
      currentSearchTerm = searchInput.value.trim();
      fetchData(currentSearchTerm);
    });

    // Trigger initial load with default value
    fetchData(currentSearchTerm);
  </script>
</body>
</html>
