<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organisations</title>
  <link rel="stylesheet" href="../base_style.css">
  
  <!-- manages the enpoint address in just one same place-->
  <script src="address.js"></script>

</head>
<body>
  <div>
    <h1>Swiss Elites – Organisations</h1>
    <input type="text" id="searchInput" value="Association">
    <div id="tableContainer">Loading data...</div>
    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    
    // gets endpoint address from one single source
    const endpoint = address;
    const ITEMS_PER_PAGE = 10;
    let allData = [];
    let currentPage = 1;
    let filteredData = [];
    let currentSearchTerm = 'Association';

    const searchInput = document.getElementById('searchInput');
    const tableContainer = document.getElementById('tableContainer');
    const paginationContainer = document.getElementById('pagination');

    function convertEntityURI(uri) {
        const match = uri.match(/^https:\/\/swiss-elites.lod4hss.cloud\/resource\/p(\d+)$/);
        if (!match) {
          return null;
        }

        const id = match[1]; // e.g., "50002" (without the 'p')
        return `https://elitessuisses.unil.ch/p/${id}`;
      }

    async function fetchData(searchTerm = '') {
      const filterClause = searchTerm ? `FILTER(CONTAINS(LCASE(?name), LCASE("${searchTerm}")))` : '';
      const query = `
        prefix owl: <http://www.w3.org/2002/07/owl#>
        prefix esr: <http://elites_suisses/resource/>
        prefix eso: <http://elites_suisses/ontology/>
        prefix xsd: <http://www.w3.org/2001/XMLSchema#>
        prefix crm: <http://www.cidoc-crm.org/cidoc-crm/>
        prefix sdh-short: <https://sdhss.org/ontology/shortcuts/>

        select ?s ?name
        where {
            ?s a crm:E74;
               sdh-short:P9 ?name.
            ${filterClause}
        }
        ORDER BY ?name
        LIMIT 100
      `;

      try {
        const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
          headers: { 'Accept': 'application/sparql-results+json' }
        });
        const data = await response.json();
        allData = data.results.bindings.map(row => ({
          uri: row.s?.value || '#',
          name: row.name?.value || 'N/A',
          birthYear: row.birthYear?.value || 'N/A'
        }));
        filteredData = [...allData];
        renderTable();
        renderPagination();
      } catch (error) {
        tableContainer.innerHTML = `<div>No results or error: ${error.message}</div>`;
      }
    }

    function renderTable() {
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const pageData = filteredData.slice(startIndex, endIndex);

      if (pageData.length === 0) {
        tableContainer.innerHTML = '<div>No results found.</div>';
        return;
      }



      let tableHTML = `<br/>
      <table><thead><tr><th>Forename</th><th>Profile</th></tr></thead><tbody>`;
      pageData.forEach(row => {
        tableHTML += `<tr><td><a href="./instance-page.html?uri=${escapeHtml(row.uri)}" target="_blank">${escapeHtml(row.name)}</a></td>
          <td><a href="${escapeHtml(convertEntityURI(row.uri) || '#')}" target="_blank">View</a></td></tr>`;
    });
      tableHTML += `</tbody></table>`;
      tableContainer.innerHTML = tableHTML;
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
      paginationContainer.innerHTML = '';

      if (totalPages <= 1) return;

      const prevButton = document.createElement('button');
      prevButton.textContent = '← Previous';
      prevButton.disabled = currentPage === 1;
      prevButton.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
          renderPagination();
        }
      });
      paginationContainer.appendChild(prevButton);

      for (let i = 1; i <= totalPages; i++) {
        const pageButton = document.createElement('button');
        pageButton.textContent = i;
        if (i === currentPage) pageButton.classList.add('active');
        pageButton.addEventListener('click', () => {
          currentPage = i;
          renderTable();
          renderPagination();
        });
        paginationContainer.appendChild(pageButton);
      }

      const nextButton = document.createElement('button');
      nextButton.textContent = 'Next →';
      nextButton.disabled = currentPage === totalPages;
      nextButton.addEventListener('click', () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderTable();
          renderPagination();
        }
      });
      paginationContainer.appendChild(nextButton);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    searchInput.addEventListener('input', () => {
      currentSearchTerm = searchInput.value.trim();
      fetchData(currentSearchTerm);
    });

    // Trigger initial load with default value
    fetchData(currentSearchTerm);
  </script>
</body>
</html>
